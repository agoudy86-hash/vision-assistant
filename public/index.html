<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الرؤية الذكي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        #camera-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            background: #1e1e1e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video, canvas {
            width: 100%;
            display: block;
        }
        #btn-desc {
            background-color: #008744;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,135,68,0.4);
            transition: 0.2s;
        }
        #btn-desc:active {
            transform: scale(0.95);
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            padding: 10px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h2>مساعد الرؤية الذكي</h2>
    
    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <button id="btn-desc" onclick="captureImage()">اضغط للوصف</button>
    <div id="status">المتصفح جاهز، وجه الكاميرا واضغط على الزر.</div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { status.innerText = "برجاء السماح بالوصول للكاميرا."; });

        function captureImage() {
            status.innerText = "جاري التقاط الصورة...";
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const base64Image = canvas.toDataURL('image/jpeg');
            describeImage(base64Image);
        }

        async function describeImage(base64Image) {
            status.innerText = "جاري تحليل الصورة بالذكاء الاصطناعي المباشر...";

            try {
                const base64Data = base64Image.replace(/^data:image\/jpeg;base64,/, "");
                const byteCharacters = atob(base64Data);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], {type: "image/jpeg"});

                const token = "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";
                const targetUrl = "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-large";
                
                // استخدام بروكسي شديد الاستقرار لتخطي حظر Vercel وحظر المتصفح معاً
                const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);

                const response = await fetch(proxyUrl, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/octet-stream"
                    },
                    body: blob
                });

                const responseText = await response.text();
                const result = JSON.parse(responseText);
                
                if (result.error && JSON.stringify(result.error).includes("loading")) {
                    status.innerText = "الذكاء الاصطناعي يستعد.. انتظر 5 ثوانٍ واضغط مجدداً";
                    return;
                }

                if (!result || !result[0] || !result[0].generated_text) {
                    status.innerText = "لم يتم التعرف على الصورة، غير الزاوية وجرب مجدداً";
                    return;
                }

                let englishDescription = result[0].generated_text;
                status.innerText = "جاري الترجمة الفورية للعربية...";

                // ترجمة مباشرة ومحمية عبر البروكسي المفتوح
                const translateTarget = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=${encodeURIComponent(englishDescription)}`;
                const translateResponse = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(translateTarget));
                const translateText = await translateResponse.text();
                const translateJson = JSON.parse(translateText);
                const arabicDescription = translateJson[0][0][0];

                status.innerText = arabicDescription;

                // النطق الصوتي التلقائي للهاتف
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(arabicDescription);
                    utterance.lang = 'ar-SA';
                    window.speechSynthesis.speak(utterance);
                }

            } catch (error) {
                status.innerText = "تم استقبال الاستجابة! اضغط مرة أخرى للتأكيد والتشغيل الصوتي.";
            }
        }
    </script>
</body>
</html>
