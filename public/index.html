<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الرؤية الذكي المطور</title>
    <style>
        :root {
            --primary-color: #00aa55;
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        #camera-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #btn-action {
            background: linear-gradient(135deg, #00aa55, #008744);
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,170,85,0.4);
            transition: all 0.2s ease;
        }
        #btn-action:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(0,170,85,0.2);
        }
        #status-box {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.6;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            min-height: 50px;
            border-right: 4px solid var(--primary-color);
        }
        .loading-dots::after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ' ....'; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مساعد الرؤية الذكي 👁️✨</h2>
        <div class="subtitle">تقنية متطورة لوصف المشاهد صوتياً للمكفوفين وضعاف البصر</div>
        
        <div id="camera-wrapper">
            <video id="video" autoplay playsinline></video>
        </div>

        <button id="btn-action" onclick="processVision()">إضغط لتحليل المشهد صوتياً</button>
        
        <div id="status-box">المتصفح جاهز بالكامل. وجه الكاميرا واضغط الزر العلوي.</div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('status-box');

        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" } 
        })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { 
            statusBox.innerHTML = "<span style='color:#ff4444;'>تنبيه: يرجى إعطاء صلاحية الوصول للكاميرا.</span>"; 
        });

        async function processVision() {
            speak("جاري التقاط الصورة");
            statusBox.innerHTML = "<span class='loading-dots'>جاري معالجة المشهد بالذكاء الاصطناعي</span>";
            
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // تحويل الصورة لنص Base64 مباشرة لتفادي مشاكل الأجهزة
            const base64Image = canvas.toDataURL('image/jpeg', 0.8);
            const base64Data = base64Image.split(',')[1];
            
            await analyzeImage(base64Data);
        }

        async function analyzeImage(base64Data) {
            const token = "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";
            const modelUrl = "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-large";
            const secureProxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(modelUrl);

            try {
                // تحويل النص إلى Binary داخل الطلب نفسه
                const binaryData = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));

                const response = await fetch(secureProxy, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/octet-stream"
                    },
                    body: binaryData
                });

                const rawText = await response.text();
                const result = JSON.parse(rawText);

                if (result.error && JSON.stringify(result.error).includes("loading")) {
                    statusBox.innerText = "الذكاء الاصطناعي يستعد.. انتظر 5 ثوانٍ واضغط مجدداً.";
                    speak("الذكاء الاصطناعي يستعد، أعد المحاولة");
                    return;
                }

                if (!result || !result[0] || !result[0].generated_text) {
                    statusBox.innerText = "لم تظهر تفاصيل واضحة، أعد المحاولة.";
                    return;
                }

                const englishDesc = result[0].generated_text;
                statusBox.innerHTML = "<span class='loading-dots'>جاري الترجمة الفورية</span>";

                const translateApi = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=${encodeURIComponent(englishDesc)}`;
                const translateResponse = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(translateApi));
                const translateText = await translateResponse.text();
                const translateJson = JSON.parse(translateText);
                
                const arabicDesc = translateJson[0][0][0];

                statusBox.innerHTML = `<strong>الوصف الذكي:</strong><br>${arabicDesc}`;
                speak(arabicDesc);

            } catch (error) {
                // طباعة الخطأ الفعلي الحادث بدلاً من الرسالة القديمة المضللة
                statusBox.innerText = "خطأ تشغيلي: " + error.message + ". اضغط مجدداً لتخطي الحماية.";
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
