<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الرؤية الذكي السحابي</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #faf8f5; }
        #video { width: 90%; max-width: 500px; border-radius: 15px; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #snap { width: 180px; height: 180px; border-radius: 50%; border: none; background: #10b981; color: white; font-size: 22px; cursor: pointer; margin-top: 20px; box-shadow: 0 8px 15px rgba(16, 185, 129, 0.3); font-weight: bold; }
        #snap:active { transform: scale(0.95); }
        #status { margin-top: 20px; font-weight: bold; color: #374151; text-align: center; padding: 0 20px; font-size: 18px; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <button id="snap">اضغط للوصف</button>
    <div id="status">جاهز للمساعدة...</div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');
        const status = document.getElementById('status');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
            } catch (err) {
                status.innerText = "فشل فتح الكاميرا. تأكد من إعطاء الصلاحية.";
            }
        }

        snap.addEventListener('click', async () => {
            status.innerText = "جاري التقاط الصورة وتحليلها سحابياً...";
            
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg');

            try {
                const response = await fetch('/api/describe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error);

                const description = data.description;
                status.innerText = description;

                const utterance = new SpeechSynthesisUtterance(description);
                utterance.lang = 'ar-SA';
                window.speechSynthesis.speak(utterance);

            } catch (error) {
                status.innerText = "خطأ: " + error.message;
                console.error(error);
            }
        });

        startCamera();
    </script>
</body>
</html>
