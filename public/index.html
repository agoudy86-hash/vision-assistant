<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الرؤية الذكي</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        #camera-container { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 20px; overflow: hidden; background: #1e1e1e; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video, canvas { width: 100%; display: block; }
        #btn-desc { background-color: #008744; color: white; border: none; padding: 20px 40px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,135,68,0.4); transition: 0.2s; }
        #btn-desc:active { transform: scale(0.95); }
        #status { margin-top: 20px; font-size: 18px; padding: 10px; color: #ccc; }
    </style>
</head>
<body>

    <h2>مساعد الرؤية الذكي</h2>
    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>
