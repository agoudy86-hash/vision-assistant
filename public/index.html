<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Vision Assistant</title>
    <style>
        :root {
            --primary-color: #00aa55;
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        #camera-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #btn-action {
            background: linear-gradient(135deg, #00aa55, #008744);
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,170,85,0.4);
            transition: all 0.2s ease;
        }
        #btn-action:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(0,170,85,0.2);
        }
        #status-box {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.6;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            min-height: 50px;
            border-left: 4px solid var(--primary-color);
            text-align: left;
        }
        .loading-dots::after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ' ....'; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Vision Assistant 👁️✨</h2>
        <div class="subtitle">Advanced AI Technology to Describe Scenes for the Visually Impaired</div>
        
        <div id="camera-wrapper">
            <video id="video" autoplay playsinline></video>
        </div>

        <button id="btn-action" onclick="processVision()">Tap to Analyze Scene</button>
        
        <div id="status-box">Camera is ready. Point at an object and tap the button above.</div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('status-box');

        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" } 
        })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { 
            statusBox.innerHTML = "<span style='color:#ff4444;'>Error: Please allow camera access in your browser settings.</span>"; 
        });

        async function processVision() {
            speak("Capturing image");
            statusBox.innerHTML = "<span class='loading-dots'>Analyzing scene with AI</span>";
            
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                if(!blob) {
                    statusBox.innerText = "Failed to capture image. Try again.";
                    return;
                }
                await analyzeImage(blob);
            }, 'image/jpeg', 0.8);
        }

        async function analyzeImage(imageBlob) {
            const token = "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";
            const modelUrl = "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-large";

            try {
                // الاتصال المباشر والنقي بدون أي وسيط لتفادي القيود تماماً
                const response = await fetch(modelUrl, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/octet-stream"
                    },
                    body: imageBlob
                });

                const result = await response.json();

                if (result.error && JSON.stringify(result.error).includes("loading")) {
                    statusBox.innerText = "AI Model is loading.. Wait 5 seconds and tap again.";
                    speak("Model is loading, please try again");
                    return;
                }

                if (!result || !result[0] || !result[0].generated_text) {
                    statusBox.innerText = "Could not detect clear details. Please re-align.";
                    return;
                }

                const englishDesc = result[0].generated_text;

                statusBox.innerHTML = `<strong>AI Description:</strong><br>${englishDesc}`;
                speak(englishDesc);

            } catch (error) {
                // عرض الخطأ البرمجي الحقيقي في حال حدوثه مباشرة للمساعدة
                statusBox.innerText = "Network Error: " + error.message + ". Tap again to retry.";
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; // تغيير النطق الصوتي للغة الإنجليزية الأمريكية
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
